[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/daemon", "crates/native-host", "crates/app/src-tauri"]
# The desktop app needs WebKitGTK development files; build it with `-p bigman-app`.
default-members = ["crates/core", "crates/cli", "crates/daemon", "crates/native-host"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["BigMan AntiVirus"]
license = "AGPL-3.0-only"

[workspace.dependencies]
bigman-core = { path = "crates/core" }
bigman-native-host = { path = "crates/native-host" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# termination: SIGTERM (systemctl stop, logout) stops cleanly, like Ctrl-C.
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
