# Licence and advisory gate (docs/plan/implementation-plan.md, principle 7).
# Bigman is AGPL-3.0-only. GPL-2.0-only code and Elastic License 2.0 content may
# only be called as subprocesses or imported by the user, so neither is allowed here.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail anywhere in the tree. "Unmaintained" notices fail only for
# crates we depend on directly; transitive ones (GTK bindings, egui) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

# Allow-list entries a given dependency set does not use are fine.
unused-allowed-license = "allow"
# egui bundles its fonts (OFL-1.1, Ubuntu Font Licence). Remove with the egui GUI.
exceptions = [{ crate = "epaint", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] }]

[licenses.private]
# Our own crates are AGPL-3.0-only and unpublished; the policy is about dependencies.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
