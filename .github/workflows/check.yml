name: checks
on:
  # Branch pushes and pull requests. Tags run these checks through release.yml.
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # cargo test regenerates the TypeScript contract; it must already be committed.
      - run: git diff --exit-code crates/app/ui/src/ipc/generated
      - run: cargo build --locked
      - run: python3 tests/cli_integration.py target/debug/bigman
      - run: python3 tests/canary_onboarding.py target/debug/bigman
      - run: python3 tests/cli_golden.py target/debug/bigman
      - run: python3 tests/daemon_integration.py target/debug
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every page the docs cite must have an archived copy in docs/references.
      - run: python3 -I scripts/archive_references.py --check
      # Every file that carries the version agrees with Cargo.toml.
      - run: python3 -I scripts/version.py check
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  app:
    runs-on: ubuntu-24.04
    needs: [ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json
      - run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libappindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          webkit2gtk-driver xvfb
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: crates/app/ui
      - run: cargo clippy --locked -p bigman-app -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo install --locked tauri-driver
      - run: xvfb-run --auto-servernum node tests/app_smoke.mjs target/debug/bigman-app
  extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigman-extension
          path: |
            browser-extension/dist
            browser-extension/*.js
            browser-extension/*.html
            browser-extension/*.css
            browser-extension/manifest.json
            browser-extension/icons
