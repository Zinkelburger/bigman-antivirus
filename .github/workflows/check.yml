name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/cli_integration.py target/debug/bigman
      - run: python3 tests/canary_onboarding.py target/debug/bigman
      - run: python3 tests/cli_golden.py target/debug/bigman
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: bigman-extension
          path: |
            browser-extension/dist
            browser-extension/*.js
            browser-extension/*.html
            browser-extension/*.css
            browser-extension/manifest.json
            browser-extension/icons
