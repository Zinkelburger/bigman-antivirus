name: release
# Pushing a tag vX.Y.Z runs every check, builds the .deb, .rpm, tarball and Arch
# PKGBUILD, installs them on each distribution below, and creates a draft GitHub
# release with them attached. Review the draft's notes, then publish it.
# Rehearse without publishing: Actions > release > Run workflow, or a pull request
# that changes the packaging. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/build-packages.sh
      - scripts/test-packages.sh
      - scripts/version.py
      - crates/app/src-tauri/tauri.conf.json
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    # Pull requests already run these through check.yml.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/check.yml

  build:
    runs-on: ubuntu-24.04
    # Built against glibc 2.35, so the programs run on Ubuntu 22.04 and Debian 12 and
    # everything newer. No caches: release files are built only from the commit.
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          build-essential ca-certificates curl git file pkg-config python3
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container runs as root over a workspace the runner owns.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The tag matches the version in the files
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -I scripts/version.py check "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: scripts/build-packages.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
          - fedora:43
          - fedora:44
          - archlinux:latest
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - run: bash scripts/test-packages.sh dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I scripts/version.py check "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      # The unpacked extension that check.yml built in this run, as a zip.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigman-extension
          path: extension
      - name: Add the browser extension
        run: |
          zip_name="bigman-extension-${GITHUB_REF_NAME#v}.zip"
          (cd extension && zip -qrX "../dist/$zip_name" .)
          (cd dist && sha256sum "$zip_name" >> SHA256SUMS)
      # Signed provenance: `gh attestation verify FILE -R OWNER/REPO` shows that this
      # workflow built the file from the tagged commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --verify-tag --generate-notes
          --title "Bigman ${GITHUB_REF_NAME#v}"
